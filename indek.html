
<!DOCTYPE html>
<html>
<head>
    <title>Kalkulator Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Kalkulator Sederhana</h2>

    <div class="container">

        <label>Angka A:</label>
        <input type="number" id="angkaA" placeholder="Masukkan angka A">

        <label>Angka B:</label>
        <input type="number" id="angkaB" placeholder="Masukkan angka B">

        <br><br>

        <button onclick="hitung('+')">Tambah (+)</button>
        <button onclick="hitung('-')">Kurang (-)</button>
        <button onclick="hitung('*')">Kali (*)</button>
        <button onclick="hitung('/')">Bagi (/)</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
